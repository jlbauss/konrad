# =============================================================================
# GitLab CI — daily lock-file refresh.
#
# Why this exists, and why on GitLab (not GitHub Actions like the build):
#
# The container image build itself lives on GitHub Actions
# (.github/workflows/build-image.yml). That move was forced by
# gitlab.git.nrw's shared docker runners not granting the user-namespace
# / clone() capabilities Podman-in-Docker needs (see commit f5bc95d).
#
# This job is different: it just resolves dependency names (uv pip
# compile, npm view, GitHub releases API) and lands the bump through an
# auto-merging MR. No Podman, no privileged container ops — runs fine on the
# same shared runner that couldn't host the image build.
#
# Why this matters: the GitLab repo is source of truth; GitHub is a
# one-way push mirror. A bot that lands commits on GitHub directly
# (where the resolve-locks workflow used to live) creates commits the
# mirror can't reconcile back to GitLab. Moving the bot to GitLab keeps
# the source of truth single, and the push to main mirrors to GitHub,
# which then triggers build-image.yml via the image/** path filter.
#
# Why an MR, not a direct push: main accepts no pushes at all — every
# commit on it, the bot's included, passed `check` in an MR pipeline
# first, so main's own push pipeline doesn't re-run it. The MR needs no
# reviewer: the push sets auto-merge, and GitLab merges (fast-forward)
# once the MR pipeline is green.
#
# Setup (manual, one-time, done in the GitLab UI):
#   1. Settings → Access Tokens → create a Project Access Token with
#      scope `write_repository`. Role must be allowed to merge into main
#      (Maintainer while main is protected), since auto-merge merges as
#      the bot. Stash as a masked + protected CI/CD variable named BOT_PAT.
#   1b. (Optional but recommended) Settings → CI/CD → Variables → add a
#      masked variable HF_TOKEN holding a HuggingFace read token. The models
#      resolver uses it to lift the anonymous HF API rate limit; without it
#      the resolver still works but can hit 429s on busy days. The image
#      build (GitHub Actions) can take the same token to lift the limit on
#      the model *download* — the unauthenticated limit failed a build once.
#   2. Settings → CI/CD → Pipeline schedules → New schedule:
#        cron:        0 1 * * *   (daily 01:00 UTC)
#        target:      main
#        description: daily lock refresh
#      The job is gated to schedule + manual web triggers on main (see
#      `rules:` below), so it never runs on regular pushes. Main only,
#      because the bump is committed on top of whatever ref the pipeline
#      runs on: started on a feature branch, its unreviewed commits would
#      ride the bot's auto-merging MR into main.
# =============================================================================

# =============================================================================
# Pipeline selection — one pipeline per change.
#
# A branch with an open MR would otherwise run twice (a `push` pipeline and a
# `merge_request_event` one), since the gates match both sources. So: MR
# pipelines run; a branch push with an open MR doesn't (the MR pipeline covers
# it, and it's the one "pipelines must succeed" reads); everything else —
# pushes to main, branches without an MR, schedules, web triggers — runs as
# before. The very first push of a branch that opens its MR via
# `-o merge_request.create` can still get both once: the MR doesn't exist yet
# when the push pipeline is created.
# =============================================================================
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - when: always

resolve-locks:
  image: node:26-trixie-slim
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "1"
  script:
    - |
      set -eux

      # ---- bootstrap toolchain --------------------------------------------
      apt-get update
      apt-get install -y --no-install-recommends \
        git curl jq ca-certificates xz-utils
      rm -rf /var/lib/apt/lists/*
      curl -fsSL https://astral.sh/uv/install.sh \
        | env UV_INSTALL_DIR=/usr/local/bin sh

      # ---- helper: resolve current manifest digest of an image ref --------
      # Speaks Docker Registry HTTP API v2 against either Docker Hub or
      # GHCR. The Accept header asks for an index (multi-arch) manifest
      # first, falling back to single-platform manifests — so for a tag
      # that points at an index we get the index digest, which is what
      # `FROM image@<digest>` resolves correctly across architectures.
      # Output: "sha256:..." on stdout; exits non-zero on failure.
      resolve_digest() {
        ref="$1"                       # e.g., node:26-trixie-slim
        # Bash parameter expansion gotcha: when $ref has no ':', both
        # ${ref%:*} and ${ref##*:} return the whole string unchanged
        # (the pattern matches nothing). That would silently produce
        # garbage URLs like .../manifests/ghcr.io/astral-sh/uv → 405.
        # Require an explicit tag in the lock and refuse to guess.
        case "$ref" in
          *:*) : ;;
          *) echo "ref '$ref' has no ':<tag>' — write the tag explicitly in the lock" >&2; return 1 ;;
        esac
        name="${ref%:*}"
        tag="${ref##*:}"
        case "$name" in
          ghcr.io/*)
            registry="ghcr.io"; path="${name#ghcr.io/}"
            auth_host="ghcr.io"; auth_service="ghcr.io"
            ;;
          *)
            registry="registry-1.docker.io"; path="$name"
            case "$path" in */*) ;; *) path="library/$path" ;; esac
            auth_host="auth.docker.io"; auth_service="registry.docker.io"
            ;;
        esac
        token="$(curl -fsSL \
          "https://${auth_host}/token?service=${auth_service}&scope=repository:${path}:pull" \
          | jq -r .token)"
        [ -n "$token" ] && [ "$token" != "null" ] \
          || { echo "auth token fetch failed for $ref" >&2; return 1; }
        digest="$(curl -fsSI \
          -H "Authorization: Bearer $token" \
          -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json" \
          "https://${registry}/v2/${path}/manifests/${tag}" \
          | awk 'tolower($1) == "docker-content-digest:" { gsub(/[\r\n]/,"",$2); print $2 }')"
        [ -n "$digest" ] \
          || { echo "no Docker-Content-Digest in manifest response for $ref" >&2; return 1; }
        printf '%s' "$digest"
      }

      # ---- helper: resolve a HF model repo's main HEAD commit sha ----------
      # HF_TOKEN (masked CI var, optional) lifts the anonymous rate limit —
      # the unauthenticated limit is what failed a build once. Output: the
      # commit sha on stdout.
      hf_main_sha() {
        repo="$1"
        if [ -n "${HF_TOKEN:-}" ]; then
          curl -fsSL -H "Authorization: Bearer $HF_TOKEN" "https://huggingface.co/api/models/${repo}"
        else
          curl -fsSL "https://huggingface.co/api/models/${repo}"
        fi | jq -r '.sha'
      }

      # ---- re-resolve each lock -------------------------------------------
      cd image/locks
      MOVED=""

      # base image: lock holds "<name>:<tag>@sha256:..." — re-resolve digest
      # for the same name:tag and bump if it moved. Major-bumping the tag
      # (e.g., node:26 → node:27) is a deliberate manual edit to base.lock;
      # the bot resolves the new digest on its next run.
      OLD_BASE="$(cat base.lock)"
      BASE_REF="${OLD_BASE%@*}"
      NEW_BASE="${BASE_REF}@$(resolve_digest "$BASE_REF")"
      if [ "$OLD_BASE" != "$NEW_BASE" ]; then
        echo "$NEW_BASE" > base.lock
        MOVED="$MOVED base"
      fi

      # uv source image — same pattern.
      OLD_UV="$(cat uv.lock)"
      UV_REF="${OLD_UV%@*}"
      NEW_UV="${UV_REF}@$(resolve_digest "$UV_REF")"
      if [ "$OLD_UV" != "$NEW_UV" ]; then
        echo "$NEW_UV" > uv.lock
        MOVED="$MOVED uv"
      fi

      # --no-annotate + --no-header strip the `# via …` lines and the
      # autogenerated header. They're informational, but every reshuffle
      # of the dep graph (or change to the uv invocation) produced
      # spurious diffs even when no version actually moved — they were
      # the biggest source of "the lock changed but didn't really change"
      # noise. Re-generate annotated locally with the same command minus
      # these two flags when you need to trace where a dep came from.
      uv pip compile python.spec \
        --torch-backend=cpu \
        --python-version=3.13 \
        --no-annotate \
        --no-header \
        -o python.lock.new
      if diff -q python.lock python.lock.new >/dev/null 2>&1; then
        rm python.lock.new
      else
        mv python.lock.new python.lock
        MOVED="$MOVED python"
      fi

      # npm itself comes from the base image (already pinned by base.lock);
      # we only resolve opencode-ai here, within the locked major: a new major
      # is a deliberate manual edit to npm.lock, like base.lock's tag. Take the
      # `latest` dist-tag while it's on that major, else the highest stable
      # release in it.
      OPENCODE_MAJOR="$(jq -r '."opencode-ai"' npm.lock | cut -d. -f1)"
      OPENCODE_VERSION="$(npm view opencode-ai version)"
      if [ "${OPENCODE_VERSION%%.*}" != "$OPENCODE_MAJOR" ]; then
        OPENCODE_VERSION="$(npm view "opencode-ai@^$OPENCODE_MAJOR" version --json \
                              | jq -r 'if type == "array" then .[] else . end' \
                              | sort -V | tail -n 1)"
      fi
      [ -n "$OPENCODE_VERSION" ] \
        || { echo "could not resolve opencode-ai within major $OPENCODE_MAJOR" >&2; exit 1; }
      jq -n --arg opencode "$OPENCODE_VERSION" \
        '{"opencode-ai": $opencode}' > npm.lock.new
      if diff -q npm.lock npm.lock.new >/dev/null 2>&1; then
        rm npm.lock.new
      else
        mv npm.lock.new npm.lock
        MOVED="$MOVED npm"
      fi

      TYPST_VERSION="$(curl -fsSL https://api.github.com/repos/typst/typst/releases/latest \
                         | jq -r .tag_name | sed 's/^v//')"
      [ -n "$TYPST_VERSION" ] && [ "$TYPST_VERSION" != "null" ] \
        || { echo "could not resolve latest Typst version" >&2; exit 1; }
      echo "$TYPST_VERSION" > typst.lock.new
      if diff -q typst.lock typst.lock.new >/dev/null 2>&1; then
        rm typst.lock.new
      else
        mv typst.lock.new typst.lock
        MOVED="$MOVED typst"
      fi

      # models: models.lock holds "<hf_repo_id> <sha>" lines (plus # comments)
      # for the docling model repos we track at upstream main. Re-resolve each
      # repo's main HEAD and rewrite the lock, preserving comments and order.
      # Tableformer + rapidocr are intentionally absent — docling pins those,
      # not us, so the bot must not touch them. A repo that resolves to nothing
      # is a hard error (deleted/renamed upstream → a maintainer must act).
      : > models.lock.new
      while IFS= read -r line || [ -n "$line" ]; do
        case "$line" in
          ''|\#*) printf '%s\n' "$line" >> models.lock.new; continue ;;
        esac
        repo="${line%% *}"
        new_sha="$(hf_main_sha "$repo")"
        [ -n "$new_sha" ] && [ "$new_sha" != "null" ] \
          || { echo "could not resolve main sha for model repo $repo" >&2; exit 1; }
        printf '%s %s\n' "$repo" "$new_sha" >> models.lock.new
      done < models.lock
      if diff -q models.lock models.lock.new >/dev/null 2>&1; then
        rm models.lock.new
      else
        mv models.lock.new models.lock
        MOVED="$MOVED models"
      fi

      # skills: skills.lock holds "<name> <repo URL> <sha> <path>" lines (plus
      # # comments). Pin each skill to the newest upstream commit that touched
      # its path (GitHub's path-filtered commits API), so the pin moves only
      # when the skill does, not on every commit to a busy repo. When that
      # commit no longer has the skill (removed upstream), the old pin stays,
      # with a warning: it still builds, and a maintainer decides what next.
      : > skills.lock.new
      while IFS= read -r line || [ -n "$line" ]; do
        case "$line" in
          ''|\#*) printf '%s\n' "$line" >> skills.lock.new; continue ;;
        esac
        set -- $line
        name="$1" repo="$2" old_sha="$3" path="$4"
        case "$repo" in
          https://github.com/*) slug="${repo#https://github.com/}"; slug="${slug%.git}" ;;
          *) echo "skill $name: only github.com upstreams resolve here ($repo)" >&2; exit 1 ;;
        esac
        new_sha="$(curl -fsSL "https://api.github.com/repos/${slug}/commits?path=${path}&per_page=1" \
                     | jq -r '.[0].sha // empty')"
        [ -n "$new_sha" ] \
          || { echo "could not resolve skill $name ($slug:$path)" >&2; exit 1; }
        if curl -fsS -o /dev/null "https://api.github.com/repos/${slug}/contents/${path}/SKILL.md?ref=${new_sha}"; then
          printf '%s %s %s %s\n' "$name" "$repo" "$new_sha" "$path" >> skills.lock.new
        else
          echo "skill $name: no SKILL.md at $path in $slug@$new_sha, keeping $old_sha" >&2
          printf '%s\n' "$line" >> skills.lock.new
        fi
      done < skills.lock
      if diff -q skills.lock skills.lock.new >/dev/null 2>&1; then
        rm skills.lock.new
      else
        mv skills.lock.new skills.lock
        MOVED="$MOVED skills"
      fi

      cd ../..

      # provider-hosts map: regenerate from models.dev (the built-in-provider
      # endpoints the egress proxy allow-lists). Same "pin upstream data, bake
      # the pinned copy" pattern as the locks above — see the script header.
      cp image/konrad-defaults/provider-hosts.json /tmp/provider-hosts.old
      ./scripts/resolve-provider-hosts.sh
      diff -q /tmp/provider-hosts.old image/konrad-defaults/provider-hosts.json >/dev/null 2>&1 \
        || MOVED="$MOVED provider-hosts"

      MOVED="$(echo "$MOVED" | xargs)"
      if [ -z "$MOVED" ]; then
        echo "Nothing moved — daily noop, exiting clean."
        exit 0
      fi
      echo "Locks moved: $MOVED"

      # ---- commit + open an auto-merging MR --------------------------------
      # Force-push to one fixed branch, so a bump that didn't merge (main
      # moved first: the fast-forward needs a rebase, and GitLab drops the
      # auto-merge) is replaced by the next run's, re-resolved against the
      # new main and re-armed by the same options — never a pile of MRs.
      # The push options open the MR on the first push and update it on
      # later ones; auto_merge merges it once the MR pipeline is green.
      git config user.email "konrad-bot@gitlab.git.nrw"
      git config user.name  "konrad-locks-bot"
      git add image/locks image/konrad-defaults/provider-hosts.json
      git commit -m "chore(locks): bump $MOVED"
      git push --force \
        -o merge_request.create \
        -o merge_request.target=main \
        -o merge_request.remove_source_branch \
        -o merge_request.auto_merge \
        -o "merge_request.title=chore(locks): bump $MOVED" \
        "https://oauth2:${BOT_PAT}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        HEAD:refs/heads/bot/locks

# =============================================================================
# Static gates — scripts/check.sh.
#
# One job runs the same script contributors and agents run locally (on a host
# checkout or inside `konrad code`): bash -n, shellcheck, reuse, markdownlint,
# actionlint, hadolint, each fetched at the version pinned in the script. So a
# gate can't pass locally and fail here on a version or flag difference, and
# adding a gate is one edit to check.sh, not a new job. Plain file checks — they
# run on the shared runner, gating MRs and branch pushes on the source-of-truth
# repo. Not main or tags: main takes merges only (fast-forward), so its commit
# is exactly the one the MR pipeline already checked.
# Tool config is auto-discovered from the repo root (.shellcheckrc,
# .hadolint.yaml, .markdownlint*.jsonc, REUSE.toml).
#
# Alpine, for speed: the gates take ~20 s, and on the runner's slow VM a Debian
# apt install of git + curl (37 packages, ~1 s of dpkg each) took ~50 s, while
# the full node image that ships them took ~62 s to pull. apk adds the three
# packages in about a second, and every pinned tool runs on musl (hadolint via
# hadolint-bin, whose static binary has a musllinux wheel).
# =============================================================================
check:
  image: node:26-alpine
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH
  before_script:
    - apk add --no-cache bash git curl jq
    - curl -fsSL https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  script:
    - ./scripts/check.sh

# =============================================================================
# Releases — every merge that users would notice gets one.
#
# release-mr runs after each push to main and prepares the next release with
# scripts/release.sh: from the commits since the last VERSION change it picks
# the bump (feat or breaking: minor; fix or perf: patch; nothing else releases)
# and has git-cliff (cliff.toml) write the CHANGELOG.md section from their
# subjects. It lands that as `chore(release): <version>` through an
# auto-merging MR, like resolve-locks. When that merges, `release` below tags
# it. Feature MRs never touch VERSION or CHANGELOG.md, so parallel MRs don't
# collide on them (they did when every MR carried its own bump).
#
# Force-push to one fixed branch: when main moves before the release MR
# merges, the push pipeline of the new commit re-runs release-mr, which
# replaces the MR's commit with one prepared on the new main, covering the new
# commits too, and re-arms auto-merge — never a pile of MRs. The release
# commit's own push finds nothing since the VERSION change and does nothing.
# Full history (GIT_DEPTH 0): the range reaches back to the last release.
# Needs BOT_PAT, set up for resolve-locks above.
# =============================================================================
release-mr:
  image: node:26-alpine
  tags: [docker]
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache bash git curl
    - curl -fsSL https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh
  script:
    - |
      set -eu
      VERSION="$(./scripts/release.sh)"
      if [ -z "$VERSION" ]; then
        echo "No feat, fix or perf since the last release — nothing to release."
        exit 0
      fi
      git config user.email "konrad-bot@gitlab.git.nrw"
      git config user.name  "konrad-release-bot"
      git commit -m "chore(release): $VERSION" VERSION CHANGELOG.md
      git push --force \
        -o merge_request.create \
        -o merge_request.target=main \
        -o merge_request.remove_source_branch \
        -o merge_request.auto_merge \
        -o "merge_request.title=chore(release): $VERSION" \
        "https://oauth2:${BOT_PAT}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" \
        HEAD:refs/heads/bot/release

# Tags what release-mr bumped: when a VERSION change lands on main, it creates
# the git tag `v<VERSION>` at that commit and a GitLab Release whose notes are
# the matching CHANGELOG.md section. Plain API calls on the shared runner; the
# GitHub mirror copies the release (.github/workflows/mirror-release.yml).
#
# Trigger: a push to main that changes VERSION, which only a release commit
# does, so it fires once per release.
#
# Auth: release-cli uses CI_JOB_TOKEN by default, which can create releases
# in this project. If `v*` is a *protected* tag and the job token can't
# create it, either grant the token's user the role or pass the existing
# BOT_PAT: add `--private-token "$BOT_PAT"` to the release-cli call.
release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags: [docker]
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"
      changes:
        - VERSION
  script:
    - |
      set -eu
      VERSION="$(cat VERSION)"
      TAG="v$VERSION"

      # Extract this version's CHANGELOG section: everything between the
      # `## [<VERSION>]` heading and the next `## [` heading, dropping the
      # leading blank line (started flips on the first non-blank). awk-only —
      # the release-cli image is BusyBox, whose sed rejects GNU brace/label
      # trims.
      NOTES="$(awk -v ver="$VERSION" '
        $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
        grab && /^## \[/ { exit }
        grab && NF { started = 1 }
        grab && started { print }
      ' CHANGELOG.md)"
      # Fail closed: a VERSION bump must carry a matching `## [<VERSION>]`
      # CHANGELOG section. A hand-made bump can miss it, and that used to ship
      # a silent pointer-only release. Better to break the release loudly than
      # publish empty notes (recovery: add the section, then re-run this job).
      if [ -z "$NOTES" ]; then
        echo "release: no '## [$VERSION]' section in CHANGELOG.md — add" \
             "'## [$VERSION] - <date>' with its entries, then re-run this job." >&2
        exit 1
      fi

      echo "Releasing $TAG at $CI_COMMIT_SHA"
      release-cli create \
        --name "konrad $TAG" \
        --tag-name "$TAG" \
        --ref "$CI_COMMIT_SHA" \
        --description "$NOTES"
