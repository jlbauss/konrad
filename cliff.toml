#
# git-cliff config: one CHANGELOG.md section from the commits since the last
# release, written by scripts/release.sh (CONTRIBUTING → Git tags & releases).
# A feat, fix or perf commit becomes an entry under Keep a Changelog's
# headings: its subject in bold, first letter upper-cased (a subject starting
# with konrad stays lowercase), then the body's first paragraph, the one
# written for users (CONTRIBUTING → Commit style), joined onto one line, since
# GitHub release notes turn every newline into a <br>. The rest of the body is
# for reviewers and stays out. Every other type is left out.

[changelog]
header = ""
body = """
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
{%- set subject = commit.message | split(pat="\n") | first | trim -%}
{%- if subject is starting_with("konrad") -%}
{%- set summary = subject -%}
{%- else -%}
{%- set summary = subject | upper_first -%}
{%- endif -%}
{%- if commit.body -%}
{%- set para = commit.body | trim | split(pat="\n\n") | first | split(pat="\n") | join(sep=" ") -%}
{%- else -%}
{%- set para = "" -%}
{%- endif %}
- {% if commit.breaking %}**Breaking:** {% endif %}**{{ summary }}.**{% if para %} {{ para }}{% endif %}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
filter_commits = true
sort_commits = "oldest"
# The <!-- n --> prefix orders the groups; the template strips it. A breaking
# commit of any type (feat!:, refactor!:) changes what users had, so it goes
# under Changed.
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 1 -->Changed" },
  { message = "^feat", group = "<!-- 0 -->Added" },
  { message = "^perf", group = "<!-- 1 -->Changed" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = ".*", skip = true },
]
